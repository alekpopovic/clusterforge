name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          ext=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            ext=".exe"
          fi
          artifact="cf-${version}-${{ matrix.goos }}-${{ matrix.goarch }}"
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -C cli -trimpath \
              -ldflags "-s -w -X github.com/textracta/clusterforge/cli/cmd.Version=${version} -X github.com/textracta/clusterforge/cli/cmd.Commit=${commit} -X github.com/textracta/clusterforge/cli/cmd.Date=${date}" \
              -o "../dist/${artifact}${ext}" .
          (cd dist && sha256sum "${artifact}${ext}" > "${artifact}${ext}.sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
