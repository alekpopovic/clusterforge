name: Provider Compatibility

on:
  pull_request:
    paths:
      - "modules/**"
      - "examples/**"
      - "live/**"
      - ".github/workflows/provider-compatibility.yml"
      - "VERSION_MATRIX.md"
  workflow_dispatch:

jobs:
  terraform:
    name: ${{ matrix.engine }} ${{ matrix.version }} / ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: terraform
            version: "1.6.6"
            stack: aws
            root: examples/aws-eks-minimal
          - engine: terraform
            version: "1.6.6"
            stack: kubernetes-helm
            root: examples/existing-kubernetes-platform-bootstrap
          - engine: terraform
            version: "1.6.6"
            stack: azure
            root: examples/azure-aks-minimal
          - engine: terraform
            version: "1.6.6"
            stack: gcp
            root: examples/gcp-gke-minimal
          - engine: terraform
            version: "1.6.6"
            stack: nomad
            root: examples/nomad-service
          - engine: terraform
            version: "1.6.6"
            stack: docker
            root: examples/docker-swarm-service
          - engine: tofu
            version: "1.6.2"
            stack: aws
            root: examples/aws-eks-minimal

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        if: matrix.engine == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.version }}

      - name: Setup OpenTofu
        if: matrix.engine == 'tofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.version }}

      - name: Terraform fmt check
        run: |
          if [ "${{ matrix.engine }}" = "tofu" ]; then
            tofu fmt -check -recursive
          else
            terraform fmt -check -recursive
          fi

      - name: Init without backend
        run: |
          if [ "${{ matrix.engine }}" = "tofu" ]; then
            tofu -chdir="${{ matrix.root }}" init -backend=false -input=false -no-color
          else
            terraform -chdir="${{ matrix.root }}" init -backend=false -input=false -no-color
          fi

      - name: Validate
        run: |
          if [ "${{ matrix.engine }}" = "tofu" ]; then
            tofu -chdir="${{ matrix.root }}" validate -no-color
          else
            terraform -chdir="${{ matrix.root }}" validate -no-color
          fi

      - name: Skip note
        run: echo "No cloud credentials or apply operations are used in provider compatibility CI."
