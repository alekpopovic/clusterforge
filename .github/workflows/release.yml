name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Test CLI
        run: make test-cli

      - name: Terraform fmt check
        run: make fmt-check

      - name: Build CLI artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "${os}" = "windows" ]; then ext=".exe"; fi
            output="dist/cf-${os}-${arch}${ext}"
            (cd cli && GOOS="${os}" GOARCH="${arch}" go build -trimpath \
              -ldflags "-s -w -X github.com/textracta/clusterforge/cli/cmd.Version=${version} -X github.com/textracta/clusterforge/cli/cmd.Commit=${commit} -X github.com/textracta/clusterforge/cli/cmd.Date=${date}" \
              -o "../${output}" .)
            (cd dist && sha256sum "cf-${os}-${arch}${ext}" > "cf-${os}-${arch}${ext}.sha256")
          done
          install -m 0755 scripts/install.sh dist/install.sh
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Smoke test release installer
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/clusterforge-bin"
          CLUSTERFORGE_DOWNLOAD_BASE_URL="file://${GITHUB_WORKSPACE}/dist" \
            INSTALL_DIR="${install_dir}" \
            VERSION="${GITHUB_REF_NAME}" \
            scripts/install.sh
          "${install_dir}/cf" version | grep -F "version: ${GITHUB_REF_NAME}"

      - name: Generate release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" > dist/RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*
