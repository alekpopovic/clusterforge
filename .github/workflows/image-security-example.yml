name: Image Security Example

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image reference to scan"
        required: true
        default: "ghcr.io/example/app:replace-me"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Optional follow-ups
        run: |
          echo "Optional: generate an SBOM with Syft."
          echo "Optional: sign and verify images with Cosign."
          echo "Optional: attach provenance with GitHub artifact attestations or SLSA tooling."
