name: Feature request
description: Propose a focused ClusterForge improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should be improved?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CLI, Terraform modules, Kubernetes, AWS, Multi-cloud, Security, Testing, Documentation]
    validations: {required: true}
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility
      description: Describe production, state, security, and backward-compatibility effects.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request contains no credentials, secrets, or private infrastructure data.
          required: true
